<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="48.6mm" viewBox="0 0 1000 270" role="img" aria-labelledby="algorithm1-title algorithm1-desc">
<title id="algorithm1-title">Graph state generation (Algorithm 1)</title><desc id="algorithm1-desc">Three panels show an S7 skeleton, its graph construction, and the generated specification. The non-null scalar role L remains a placeholder. A single root has eight HIGH targets and three REF targets, depicted as target bundles. The output G and construction conditions I are passed to Algorithm 2 and checked after materialization.</desc>
<defs>
<marker id="algorithm1-black" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#000000"/></marker>
<marker id="algorithm1-red" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#B32025"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="270" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.1"/>
<g id="algorithm1-skeleton" aria-label="Skeleton and its semantic condition">
<rect x="8" y="8" width="254" height="250" rx="0" fill="#FFFFFF" stroke="#000000" stroke-width="0.8"/>
<text x="135.0" y="32" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" font-style="normal" text-anchor="middle">(a) Skeleton S</text>
<line x1="8" y1="46" x2="262" y2="46" stroke="#000000" stroke-width="0.7"/>
<line x1="135" y1="119" x2="65" y2="156" stroke="#000000" stroke-width="1.05"/>
<line x1="135" y1="119" x2="135" y2="153" stroke="#000000" stroke-width="1.05"/>
<line x1="135" y1="119" x2="202" y2="151" stroke="#000000" stroke-width="1.05"/>
<rect x="80" y="92" width="110" height="27" rx="2" fill="#FFFFFF" stroke="#000000" stroke-width="1.1"/>
<text x="135" y="110" fill="#000000" font-family="Courier New, Courier, monospace" font-size="15.5" font-weight="400" font-style="normal" text-anchor="middle">coalesce</text>
<rect x="41" y="156" width="48" height="28" rx="2" fill="#FFFFFF" stroke="#000000" stroke-width="1.1"/>
<text x="65" y="175" fill="#000000" font-family="Courier New, Courier, monospace" font-size="15" font-weight="400" font-style="normal" text-anchor="middle">NULL</text>
<circle cx="135" cy="170" r="17" fill="#FFFFFF" stroke="#000000" stroke-width="1.25" stroke-dasharray="3 3"/>
<text x="135" y="176" fill="#000000" font-family="Times New Roman, Times, serif" font-size="20" font-weight="400" font-style="italic" text-anchor="middle">L</text>
<circle cx="202" cy="170" r="19" fill="#FFFFFF" stroke="#000000" stroke-width="1.25" stroke-dasharray="3 3"/>
<text x="202" y="176" fill="#000000" font-family="Times New Roman, Times, serif" font-size="19" font-weight="400" font-style="italic" text-anchor="middle">E<tspan baseline-shift="sub" font-size="13.68">H</tspan></text>
<text x="135" y="214" fill="#000000" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" font-style="italic" text-anchor="middle">L ≠ NULL</text>
<text x="135" y="242" fill="#000000" font-family="Times New Roman, Times, serif" font-size="17" font-weight="400" font-style="italic" text-anchor="middle">p = S7,  N = 2</text>
</g>
<line x1="269" y1="143" x2="295" y2="143" stroke="#000000" stroke-width="1.35" marker-end="url(#algorithm1-black)"/>
<g id="algorithm1-graph" aria-label="Graph construction with explicitly counted target bundles">
<rect x="302" y="8" width="414" height="250" rx="0" fill="#FFFFFF" stroke="#000000" stroke-width="0.8"/>
<text x="509.0" y="32" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" font-style="normal" text-anchor="middle">(b) Graph state G</text>
<line x1="302" y1="46" x2="716" y2="46" stroke="#000000" stroke-width="0.7"/>
<line x1="382" y1="131" x2="549" y2="90" stroke="#000000" stroke-width="1.25" marker-end="url(#algorithm1-black)"/>
<line x1="382" y1="148" x2="549" y2="187" stroke="#000000" stroke-width="1.25" marker-end="url(#algorithm1-black)"/>
<circle cx="365" cy="139" r="18" fill="#FFFFFF" stroke="#000000" stroke-width="1.25"/>
<text x="365" y="145" fill="#000000" font-family="Times New Roman, Times, serif" font-size="20" font-weight="400" font-style="italic" text-anchor="middle">u</text>
<text x="365" y="177" fill="#000000" font-family="Courier New, Courier, monospace" font-size="15" font-weight="400" font-style="normal" text-anchor="middle">:Root</text>
<text x="365" y="196" fill="#000000" font-family="Courier New, Courier, monospace" font-size="15" font-weight="400" font-style="normal" text-anchor="middle">{id:1}</text>
<circle cx="573" cy="81" r="15" fill="#FFFFFF" stroke="#000000" stroke-width="1.1"/>
<circle cx="569" cy="84" r="15" fill="#FFFFFF" stroke="#000000" stroke-width="1.1"/>
<circle cx="565" cy="87" r="15" fill="#FFFFFF" stroke="#000000" stroke-width="1.1"/>
<text x="612" y="80" fill="#000000" font-family="Times New Roman, Times, serif" font-size="21" font-weight="400" font-style="italic" text-anchor="start">H</text>
<text x="612" y="103" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" font-style="normal" text-anchor="start">×8</text>
<circle cx="573" cy="184" r="15" fill="#FFFFFF" stroke="#000000" stroke-width="1.1"/>
<circle cx="569" cy="187" r="15" fill="#FFFFFF" stroke="#000000" stroke-width="1.1"/>
<circle cx="565" cy="190" r="15" fill="#FFFFFF" stroke="#000000" stroke-width="1.1"/>
<text x="612" y="183" fill="#000000" font-family="Times New Roman, Times, serif" font-size="21" font-weight="400" font-style="italic" text-anchor="start">R</text>
<text x="612" y="206" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" font-style="normal" text-anchor="start">×3</text>
<text x="468" y="95" fill="#000000" font-family="Courier New, Courier, monospace" font-size="15" font-weight="400" font-style="normal" text-anchor="middle">HIGH</text>
<text x="468" y="192" fill="#000000" font-family="Courier New, Courier, monospace" font-size="15" font-weight="400" font-style="normal" text-anchor="middle">REF</text>
<text x="509" y="239" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" font-style="normal" text-anchor="middle">Targets: mark = true</text>
</g>
<line x1="723" y1="143" x2="749" y2="143" stroke="#000000" stroke-width="1.35" marker-end="url(#algorithm1-black)"/>
<g id="algorithm1-output" aria-label="Construction specification and handoff to Algorithm 2">
<rect x="756" y="8" width="236" height="250" rx="0" fill="#FFFFFF" stroke="#000000" stroke-width="0.8"/>
<text x="874.0" y="32" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" font-style="normal" text-anchor="middle">(c) Output</text>
<line x1="756" y1="46" x2="992" y2="46" stroke="#000000" stroke-width="0.7"/>
<text x="874" y="89" fill="#000000" font-family="Times New Roman, Times, serif" font-size="27" font-weight="400" font-style="italic" text-anchor="middle">(G, I)</text>
<text x="790" y="126" fill="#000000" font-family="Times New Roman, Times, serif" font-size="19" font-weight="400" font-style="italic" text-anchor="start">I:</text>
<text x="820" y="126" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400" font-style="normal" text-anchor="start">one root</text>
<text x="820" y="154" fill="#000000" font-family="Times New Roman, Times, serif" font-size="17" font-weight="400" font-style="italic" text-anchor="start">|H| = 8, |R| = 3</text>
<line x1="874" y1="175" x2="874" y2="202" stroke="#000000" stroke-width="1.3" marker-end="url(#algorithm1-black)"/>
<text x="874" y="232" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="400" font-style="normal" text-anchor="middle">Algorithm 2</text>
</g>
</svg>
