<svg xmlns="http://www.w3.org/2000/svg" width="330" height="720" viewBox="0 0 330 720" role="img" aria-labelledby="panel-title panel-desc">
<title id="panel-title">Random typed AST generation: clauses, expansion and an abstract query</title>
<desc id="panel-desc">One example samples MATCH then RETURN, selects COUNT from integer productions, and forms a Query AST with an unbound label alpha and exactly one typed result-table slot for later Pattern embedding. Gray dashed productions are alternatives.</desc>
