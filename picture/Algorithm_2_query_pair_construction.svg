<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="81.72mm" viewBox="0 0 1000 454" role="img" aria-labelledby="algorithm2-title algorithm2-desc">
<title id="algorithm2-title">Skeleton population and query mutation (Algorithm 2)</title><desc id="algorithm2-desc">Two aligned rows illustrate independent S7 and P1 instances. Each row proceeds from a skeleton to a base query and a mutated query. Graph information and construction conditions guide skeleton population. In S7, L is instantiated as zero and E_H as a COUNT subquery; reference substitution changes only the HIGH relationship type to REF. In P1, endpoint symmetry exchanges the written endpoint order, retaining each variable&#x27;s labels, identifier constraint, and projection. Each mutated query is derived from a copy of its own base query. Dashed nodes are placeholders; red and explicit labels identify local changes.</desc>
