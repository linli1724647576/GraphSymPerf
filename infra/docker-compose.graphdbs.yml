services:
  neo4j:
    image: neo4j:2026.05.0
    container_name: graphsymperf-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/graphsymperf_neo4j
      NEO4J_dbms_memory_transaction_total_max: 4G
      NEO4J_server_memory_heap_initial__size: 2G
      NEO4J_server_memory_heap_max__size: 4G
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u neo4j -p graphsymperf_neo4j 'RETURN 1;' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  neo4j-ladybug-proxy:
    image: neo4j:2026.05.0
    container_name: graphsymperf-neo4j-ladybug-proxy
    restart: unless-stopped
    ports:
      - "7475:7474"
      - "7697:7687"
    environment:
      NEO4J_AUTH: neo4j/graphsymperf_ladybug_proxy
      NEO4J_dbms_memory_transaction_total_max: 4G
      NEO4J_server_memory_heap_initial__size: 2G
      NEO4J_server_memory_heap_max__size: 4G
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u neo4j -p graphsymperf_ladybug_proxy 'RETURN 1;' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  memgraph:
    image: memgraph/memgraph
    container_name: graphsymperf-memgraph
    restart: unless-stopped
    ports:
      - "7688:7687"
      - "7444:7444"
    command:
      - "--log-level=TRACE"
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | mgconsole --host 127.0.0.1 --port 7687 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  falkordb:
    image: falkordb/falkordb:latest
    container_name: graphsymperf-falkordb
    restart: unless-stopped
    ports:
      - "6389:6379"
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli GRAPH.QUERY graph_sym_perf 'RETURN 1' || redis-cli GRAPH.QUERY sqlancer 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  agensgraph:
    image: bitnine/agensgraph:latest
    container_name: graphsymperf-agensgraph
    restart: unless-stopped
    ports:
      - "5456:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: graphsymperf_agens
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    command:
      - "postgres"
      - "-c"
      - "password_encryption=md5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres && PGPASSWORD=graphsymperf_agens psql -U postgres -d postgres -c 'SELECT 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  agensgraph-age-proxy:
    image: bitnine/agensgraph:latest
    container_name: graphsymperf-agensgraph-age-proxy
    restart: unless-stopped
    ports:
      - "5457:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: graphsymperf_age_proxy
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    command:
      - "postgres"
      - "-c"
      - "password_encryption=md5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres && PGPASSWORD=graphsymperf_age_proxy psql -U postgres -d postgres -c 'SELECT 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  arcadedb:
    image: arcadedata/arcadedb:latest
    container_name: graphsymperf-arcadedb
    restart: unless-stopped
    ports:
      - "2481:2480"
      - "2425:2424"
      - "5433:5432"
    environment:
      JAVA_TOOL_OPTIONS: "-Darcadedb.server.rootPassword=playwithdata -Darcadedb.server.plugins=Postgres:com.arcadedb.postgres.PostgresProtocolPlugin"
      ARCADEDB_OPTS_MEMORY: "-Xms1G -Xmx2G"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2480/api/v1/ready || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

  apache-age:
    image: apache/age:latest
    container_name: graphsymperf-apache-age
    restart: unless-stopped
    ports:
      - "5455:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: graphsymperf_age
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    command:
      - "postgres"
      - "-c"
      - "password_encryption=md5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres && PGPASSWORD=graphsymperf_age psql -U postgres -d postgres -c 'SELECT 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
