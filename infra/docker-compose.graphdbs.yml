services:
  neo4j:
    image: neo4j:2026.05.0
    container_name: graphsymperf-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/graphsymperf_neo4j
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u neo4j -p graphsymperf_neo4j 'RETURN 1;' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  memgraph:
    image: memgraph/memgraph
    container_name: graphsymperf-memgraph
    restart: unless-stopped
    ports:
      - "7688:7687"
      - "7444:7444"
    command:
      - "--log-level=TRACE"
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | mgconsole --host 127.0.0.1 --port 7687 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  falkordb:
    image: falkordb/falkordb:latest
    container_name: graphsymperf-falkordb
    restart: unless-stopped
    ports:
      - "6389:6379"
      - "3000:3000"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  agensgraph:
    image: bitnine/agensgraph:latest
    container_name: graphsymperf-agensgraph
    restart: unless-stopped
    ports:
      - "5456:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: graphsymperf_agens
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 10s
      retries: 20

  arcadedb:
    image: arcadedata/arcadedb:latest
    container_name: graphsymperf-arcadedb
    restart: unless-stopped
    ports:
      - "2481:2480"
      - "2425:2424"
    environment:
      JAVA_TOOL_OPTIONS: "-Darcadedb.server.rootPassword=playwithdata"
      ARCADEDB_OPTS_MEMORY: "-Xms512M -Xmx512M"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2480/api/v1/ready || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

  apache-age:
    image: apache/age:latest
    container_name: graphsymperf-apache-age
    restart: unless-stopped
    ports:
      - "5455:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: graphsymperf_age
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 10s
      retries: 20
