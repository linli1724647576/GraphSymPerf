<text x="100" y="1057" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="26" font-weight="400" fill="#15324F" text-anchor="start">κ 非空；只替换回退参数 L</text>
