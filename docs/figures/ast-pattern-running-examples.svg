<text x="1160" y="1061" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="25" font-weight="400" fill="#52677C" text-anchor="start">整体被使用，回退项应短路</text>
