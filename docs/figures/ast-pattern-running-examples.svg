<text x="1160" y="539" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="25" font-weight="400" fill="#52677C" text-anchor="start">反转保持 ALL 的真假</text>
