<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1480" viewBox="0 0 1600 1480" role="img" aria-labelledby="title desc">
<title id="title">P3 与 S7 两个贯穿示例及外层屏蔽对照</title>
<desc id="desc">P3通过失败候选扩大路径搜索机会并反转无向路径，计数保持为一；S7通过非空前缀保护不同回退表达式，返回相同多重集；最后对照整个目标值被外层忽略的情况。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52677C"/></marker>
<marker id="work-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#C76B24"/></marker>
</defs>
<rect width="1600" height="1480" fill="white"/>
<text x="65" y="62" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="40" font-weight="700" fill="#15324F" text-anchor="start">两个例子贯穿六阶段：路径反转与短路替换</text>
<text x="65" y="103" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="23" font-weight="400" fill="#52677C" text-anchor="start">图规模与名称仅作方法示例；蓝色表示结构，橙色表示被排除或受保护的潜在工作</text>
<rect x="65" y="135" width="1470" height="475" rx="18" fill="#FCFDFE" stroke="#D8E2EB" stroke-width="2"/>
<text x="92" y="179" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="31" font-weight="700" fill="#2B6CB0" text-anchor="start">例 A｜无向路径反转（P3）</text>
<text x="90" y="227" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="27" font-weight="650" fill="#15324F" text-anchor="start">随机结构与局部规则</text>
<text x="90" y="262" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="22" font-weight="400" fill="#52677C" text-anchor="start">M1–M2</text>
<text x="615" y="227" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="27" font-weight="650" fill="#15324F" text-anchor="start">模式感知图状态</text>
<text x="615" y="262" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="22" font-weight="400" fill="#52677C" text-anchor="start">M3</text>
<text x="1160" y="227" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="27" font-weight="650" fill="#15324F" text-anchor="start">查询对与外层观察</text>
<text x="1160" y="262" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="22" font-weight="400" fill="#52677C" text-anchor="start">M4–M6</text>
