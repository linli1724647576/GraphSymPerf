<text x="94" y="1255" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="29" font-weight="600" fill="#2B6CB0" text-anchor="start">COUNT { RETURN coalesce(…) AS x }</text>
<text x="800" y="1255" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="27" font-weight="600" fill="#C76B24" text-anchor="start">只数返回行，不使用 x → 目标被屏蔽</text>
<text x="94" y="1324" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="26" font-weight="400" fill="#52677C" text-anchor="start">当前流程重新生成该目标；它与“整体被观察、仅内部回退项应短路”的有效 S7 用例不同。</text>
<text x="65" y="1428" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="24" font-weight="400" fill="#52677C" text-anchor="start">mN 仅表示逐输入枚举 H 时的潜在候选规模；物理调用、缓存、去相关和实际性能需要执行验证。</text>
