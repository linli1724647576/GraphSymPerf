<text x="280" y="414" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="28" font-weight="650" fill="#2B6CB0" text-anchor="middle">COUNT { □结果表 }</text>
