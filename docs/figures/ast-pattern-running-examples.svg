<text x="943" y="285" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="22" font-weight="400" fill="#2D7A64" text-anchor="start">Target</text>
<text x="736" y="506" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="23" font-weight="600" fill="#C76B24" text-anchor="start">keep=false</text>
<text x="620" y="534" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="22" font-weight="400" fill="#52677C" text-anchor="start">t、z₁、z₂ 均为 Target</text>
<text x="620" y="564" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="27" font-weight="650" fill="#2D7A64" text-anchor="start">3 条候选 → 1 条有效路径</text>
<text x="1160" y="312" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="30" font-weight="600" fill="#2B6CB0" text-anchor="start">Q₁：s — … — t</text>
