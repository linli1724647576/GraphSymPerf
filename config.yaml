language: cypher

database:
  system: neo4j
  uri: bolt://127.0.0.1:7687
  user: neo4j
  password_env: GRAPHSYMPERF_NEO4J_PASSWORD
  name: neo4j
  batch_size: 5000

generation:
  clauses: 4
  nodes: 100
  expression_depth: 3
  subquery_depth: 3
  conditional_queries: true

graph:
  background_nodes: 50
  background_relationships: 100
  high_units: 100000
  indexes: true

run:
  mode: experiment  # experiment, generate, or check
  seed: 0
  case_seed: null  # Set a fixed case seed to run one round.
  save_all: false
  rounds: 10
  minutes: 60
  output: results
  patterns: [S1, S2, S3, S4, S5, S6, S7, S8, Y1, Y2, Y3, Y4, Y5, Y6, Y7, Y8]

replay:
  case: null  # Path to an archived case directory.
  check_only: false

measurement:
  warmups: 3
  pairs: 6
  confirmation_warmups: 5
  confirmation_pairs: 20
  ratio: 5.0
  minimum_delta_ms: 100.0
  direction_consistency: 0.8
  timeout_seconds: 10
