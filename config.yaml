language: cypher

database:
  system: neo4j
  uri: bolt://127.0.0.1:7687
  user: neo4j
  password_env: GRAPHSYMPERF_NEO4J_PASSWORD
  name: neo4j
  batch_size: 5000

generation:
  clauses: 4
  nodes: 100
  expression_depth: 3
  subquery_depth: 3
  conditional_queries: true

graph:
  background_nodes: 50
  background_relationships: 100
  high_units: 100000
  indexes: true

run:
  mode: experiment  # experiment, generate, or check
  seed: 0
  case_seed: null  # Set a fixed case seed to run one round.
  save_all: false
  rounds: 10
  minutes: 60
  output: results
  patterns: [SC1, SC2, SC3, SC4, SC5, SC6, SC7, SC8, SY1, SY2, SY3, SY4, SY5, SY6, SY7, SY8]

replay:
  case: null  # Path to an archived case directory.
  check_only: false

measurement:
  warmups: 3
  pairs: 6
  confirmation_warmups: 5
  confirmation_pairs: 20
  ratio: 5.0
  minimum_delta_ms: 100.0
  direction_consistency: 0.8
  scale_factor: 10        # Re-measure no_gap pairs at high_units / scale_factor; null disables.
  growth_ratio: 3.0       # Minimum increase in the runtime gap between the two scales.
  timeout_seconds: 10
