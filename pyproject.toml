[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-sym-perf"
version = "0.1.0"
description = "Cost-aware equivalent-query testing for graph databases."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "lark>=1.2,<2", "neo4j>=5.28,<7"]

[project.optional-dependencies]
test = ["pytest>=8.0"]
falkordb = ["falkordb>=1.7.1,<2"]

[tool.setuptools]
package-dir = {"" = "Src"}
py-modules = ["main", "query", "generator", "mutator", "executor", "summarize"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["Src"]
markers = ["integration: requires an explicitly supplied dedicated graph database"]
