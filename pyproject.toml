[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-sym-perf"
version = "0.0.0"
description = "Real-database symmetry-violation performance mining for graph DBMSs."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "GraphSymPerf contributors" }
]
dependencies = [
  "PyYAML>=6.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8.0"
]
neo4j = [
  "neo4j>=5.0"
]
memgraph = [
  "neo4j>=5.0"
]
falkordb = [
  "FalkorDB>=1.6"
]
agensgraph = [
  "psycopg[binary]>=3.1"
]
apache_age = [
  "psycopg[binary]>=3.1"
]
arcadedb = [
  "requests>=2.31"
]
kuzu = [
  "kuzu>=0.11"
]
db = [
  "neo4j>=5.0",
  "gqlalchemy>=1.8",
  "FalkorDB>=1.6",
  "psycopg[binary]>=3.1",
  "requests>=2.31",
  "kuzu>=0.11"
]

[project.scripts]
graph-sym-perf = "graph_sym_perf.cli.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
