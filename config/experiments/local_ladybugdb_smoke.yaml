experiment_id: local_ladybugdb_smoke_2026_07
description: Local smoke test for LadybugDB embedded graph database (community fork of Kuzu).
seed: 20260703
output_root: runs/local_ladybugdb_smoke_2026_07

systems:
  targets:
    - ladybugdb

source:
  enabled:
    - ldbc_templates
  load: true
  base_run_config: config/graph_sym_perf.yaml
  result_limit: 50
  ldbc_templates:
    max_seed_queries_per_shard: 10

transforms:
  enabled_families:
    - symmetry
    - bool_redundancy
  enabled_rules:
    - node_order_symmetry
    - edge_notation_symmetry
    - predicate_order_symmetry
    - pattern_order_symmetry
    - pattern_decomposition_symmetry
    - label_order_symmetry
    - alpha_renaming_symmetry
    - and_true_or
    - or_false_and
    - and_case_true
    - and_excluded_middle_or_null
  max_variants_per_case: 2

coverage:
  enabled: true

feedback:
  enabled: false

oracle:
  enable_structural_diff: true
  enable_profile_metrics: true

clustering:
  enabled: true
  include_plan_only: true

reducer:
  enabled: selective
  strategy: validated
  reduce_graph: true
  preserve_metric_ratio: 1.5
  max_query_attempts: 32

execution:
  shards: 1
  cases_per_shard: 10
  per_query_timeout_seconds: 30
  per_case_timeout_seconds: 120
  resume: false
  write_every_n_cases: 2

artifacts:
  write_issue_drafts: false
