experiment_id: feedback_guided_2026_01
description: Feedback ablation treatment with feedback-guided transform selection enabled.
seed: 20260522
output_root: runs/feedback_guided_2026_01

systems:
  targets:
    - neo4j

source:
  kind: gdsmith
  base_run_config: config/graph_sym_perf.yaml
  max_cases: 4000
  gdsmith:
    num_queries: 4000

transforms:
  enabled_families:
    - bool_redundancy
    - symmetry
  enabled_rules:
    - and_true_or
    - or_false_and
    - and_expr_null_partition
    - or_expr_null_contradiction
    - predicate_order_symmetry
    - pattern_order_symmetry
    - label_order_symmetry
    - alpha_renaming_symmetry
  max_variants_per_case: 4

coverage:
  enabled: true

feedback:
  enabled: true
  exploration_rate: 0.15
  min_rules_per_case: 1
  max_rules_per_case: 4

oracle:
  enable_structural_diff: true
  enable_profile_metrics: true

clustering:
  enabled: true

reducer:
  strategy: no_op

execution:
  shards: 4
  cases_per_shard: 1000
  per_query_timeout_seconds: 60
  per_case_timeout_seconds: 180
  resume: true
  write_every_n_cases: 25

artifacts:
  write_issue_drafts: false
