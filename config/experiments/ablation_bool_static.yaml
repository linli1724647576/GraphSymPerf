experiment_id: ablation_bool_static_2026_01
description: Bool-redundancy-only static ablation, aligned with document/2.md naming.
seed: 20260522
output_root: runs/ablation_bool_static_2026_01

systems:
  targets:
    - neo4j
    - memgraph
    - falkordb
    - agensgraph
    - arcadedb
    - apache_age

source:
  enabled:
    - gdsmith
    - ldbc_templates
  generator_target: neo4j
  base_run_config: config/graph_sym_perf.yaml
  gdsmith:
    max_seed_queries_per_shard: 2000
    num_queries: 2000
    num_tries: 1
  ldbc_templates:
    enabled: true
    max_seed_queries_per_shard: 200

transforms:
  enabled_families:
    - bool_redundancy
  enabled_rules:
    - and_true_or
    - and_expr_or_true
    - or_false_and
    - or_expr_and_false
    - and_not_false_and
    - and_case_true
    - and_expr_null_partition
    - or_expr_null_contradiction
    - and_not_expr_null_contradiction
    - and_excluded_middle_or_null
    - or_guarded_contradiction
    - and_double_negated_true_or
    - or_duplicate_predicate
    - and_null_guarded_true
    - and_distributive_absorption
    - and_multi_layer_redundancy
  max_variants_per_case: 4

coverage:
  enabled: true

feedback:
  enabled: false

oracle:
  enable_structural_diff: true
  enable_profile_metrics: true

clustering:
  enabled: true

reducer:
  strategy: no_op

execution:
  shards: 4
  cases_per_shard: 500
  per_query_timeout_seconds: 60
  per_case_timeout_seconds: 180
  resume: true
  write_every_n_cases: 25

artifacts:
  write_issue_drafts: false
