experiment_id: symmetry_effectiveness_2026_07
description: Symmetry-only effectiveness run across all ready systems. Ensures symmetry coverage complementary to the main both-family run.
seed: 20260703
output_root: runs/symmetry_effectiveness_2026_07

systems:
  targets:
    - neo4j
    - memgraph
    - falkordb
    - agensgraph
    - apache_age

source:
  enabled:
    - gdsmith
  generator_per_system: true
  generator_target: neo4j
  base_run_config: config/graph_sym_perf.yaml
  result_limit: 100
  include_variable_length: true
  gdsmith:
    max_seed_queries_per_shard: 10000
    num_queries: 10000
    num_tries: 1
    timeout_seconds: 600

transforms:
  enabled_families:
    - symmetry
  enabled_rules:
    - node_order_symmetry
    - edge_notation_symmetry
    - predicate_order_symmetry
    - pattern_order_symmetry
    - pattern_decomposition_symmetry
    - pattern_fusion_symmetry
    - path_endpoint_symmetry
    - label_order_symmetry
    - property_map_order_symmetry
    - alpha_renaming_symmetry
  # Strict rules only for core claims (document/总体研究主线.md §4).
  gdsmith_safe_only: true

coverage:
  enabled: true
  include_transformation_context: true
  write_per_case_evidence: true
  novelty_weights:
    structural: 1.0
    operator_delta: 0.5
    access_delta: 3.0
    predicate_delta: 0.5
    join_delta: 2.5
    barrier_delta: 3.0
    cardinality_delta: 2.5
    expand_delta: 2.0
    work_delta: 1.5
    latency_delta: 1.0
    transformation_context: 0.2
  metric_thresholds:
    rows: 1.5
    db_hits: 1.5
    estimated_rows: 2.0
    memory_bytes: 1.5
    page_cache_misses: 1.5

feedback:
  enabled: true
  exploration_rate: 0.25
  min_rules_per_case: 2
  max_rules_per_case: 6
  reward_weights:
    generated: 1.0
    equivalence_passed: 2.0
    profile_available: 3.0
    candidate_count: 3.0
    strong_candidate_count: 6.0
    pmc_new_units: 4.0
    pmc_units: 0.2
    equivalence_failed: -2.0
    timeout: -3.0
    error: -2.0
    skipped: -1.0

oracle:
  enable_structural_diff: true
  enable_profile_metrics: true
  runtime_validation_policy: conservative

confirmation:
  min_latency_ratio: 5.0
  min_latency_delta_ms: 50.0
  min_db_hits_ratio: 5.0
  min_rows_ratio: 5.0

clustering:
  enabled: true
  write_signatures: true
  include_plan_only: true
  include_exploratory: false

reducer:
  enabled: selective
  strategy: validated
  reduce_graph: true
  preserve_metric_ratio: 1.5
  max_query_attempts: 32

execution:
  shards: 8
  workers_per_shard: 2
  cases_per_shard: 10000
  per_query_timeout_seconds: 60
  per_case_timeout_seconds: 180
  resume: true
  fail_fast: false
  isolate_system_per_worker: true
  write_every_n_cases: 25

artifacts:
  write_issue_drafts: true
