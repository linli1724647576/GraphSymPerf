experiment_id: main_effectiveness_2026_01
description: Main effectiveness run for GraphSymPerf with both bool_redundancy and symmetry families.
seed: 20260522
output_root: runs/main_effectiveness_2026_01

systems:
  targets:
    - neo4j
    - memgraph
    - falkordb
    - agensgraph
    - arcadedb
    - apache_age
    - ladybugdb

source:
  enabled:
    - gdsmith
  # When generator_per_system is true, GDsmith is run independently for each
  # ready target system so queries are generated in each system's native Cypher
  # dialect.  This avoids the >90% cross-system skip rates caused by using
  # Neo4j-generated queries on PostgreSQL-based systems (AgensGraph, Apache AGE)
  # and Memgraph.  generator_target is used as a fallback for systems without
  # a GDsmith backend.
  generator_per_system: true
  generator_target: neo4j
  base_run_config: config/graph_sym_perf.yaml
  result_limit: 100
  include_variable_length: true
  gdsmith:
    max_seed_queries_per_shard: 50000
    num_queries: 50000
    num_tries: 1
    timeout_seconds: 600

transforms:
  enabled_families:
    - bool_redundancy
    - symmetry
  enabled_rules:
    - and_true_or
    - and_expr_or_true
    - or_false_and
    - or_expr_and_false
    - and_not_false_and
    - and_case_true
    - and_expr_null_partition
    - or_expr_null_contradiction
    - and_not_expr_null_contradiction
    - and_excluded_middle_or_null
    - or_guarded_contradiction
    - and_double_negated_true_or
    - or_duplicate_predicate
    - and_null_guarded_true
    - and_distributive_absorption
    - and_multi_layer_redundancy
    - arcade_and_true
    - arcade_or_false
    - arcade_and_not_false
    - arcade_and_true_or_false_expr
    - node_order_symmetry
    - edge_notation_symmetry
    - predicate_order_symmetry
    - pattern_order_symmetry
    - pattern_decomposition_symmetry
    - pattern_fusion_symmetry
    - path_endpoint_symmetry
    - label_order_symmetry
    - property_map_order_symmetry
    - alpha_renaming_symmetry
  # Exploratory symmetry rules are excluded from the main experiment
  # (document/总体研究主线.md §4: strict rules only for core claims).
  # See config/experiments/exploratory_symmetry.yaml for the exploratory run.
  gdsmith_safe_only: true
  # No static cap — the feedback scheduler drives per-case rule selection.
  # A low max_variants_per_case was truncating symmetry rules (positions 5–10
  # in the enabled list) before the scheduler could assign rewards.

coverage:
  enabled: true
  include_transformation_context: true
  write_per_case_evidence: true
  metric_thresholds:
    rows: 1.5
    db_hits: 1.5
    estimated_rows: 2.0
    memory_bytes: 1.5
    page_cache_misses: 1.5

feedback:
  enabled: true
  exploration_rate: 0.15
  min_rules_per_case: 1
  max_rules_per_case: 4

oracle:
  enable_structural_diff: true
  enable_profile_metrics: true
  runtime_validation_policy: conservative

confirmation:
  min_latency_ratio: 5.0
  min_latency_delta_ms: 50.0
  min_db_hits_ratio: 5.0
  min_rows_ratio: 5.0

clustering:
  enabled: true
  write_signatures: true
  include_plan_only: true
  include_exploratory: false

reducer:
  enabled: selective
  strategy: validated
  reduce_graph: true
  preserve_metric_ratio: 1.5
  max_query_attempts: 32

execution:
  shards: 16
  workers_per_shard: 2
  cases_per_shard: 50000
  per_query_timeout_seconds: 60
  per_case_timeout_seconds: 180
  resume: true
  fail_fast: false
  isolate_system_per_worker: true
  write_every_n_cases: 25

artifacts:
  write_issue_drafts: true
