experiment_id: ablation_symmetry_static_2026_01
description: Symmetry-only static ablation, aligned with document/2.md naming.
seed: 20260522
output_root: runs/ablation_symmetry_static_2026_01

systems:
  targets:
    - neo4j
    - memgraph
    - falkordb
    - agensgraph
    - arcadedb
    - apache_age

source:
  enabled:
    - gdsmith
    - ldbc_templates
  generator_target: neo4j
  base_run_config: config/graph_sym_perf.yaml
  gdsmith:
    max_seed_queries_per_shard: 2000
    num_queries: 2000
    num_tries: 1
  ldbc_templates:
    enabled: true
    max_seed_queries_per_shard: 200

transforms:
  enabled_families:
    - symmetry
  enabled_rules:
    - node_order_symmetry
    - edge_notation_symmetry
    - predicate_order_symmetry
    - pattern_order_symmetry
    - pattern_decomposition_symmetry
    - pattern_fusion_symmetry
    - path_endpoint_symmetry
    - label_order_symmetry
    - property_map_order_symmetry
    - alpha_renaming_symmetry
    - exploratory_pattern_order_symmetry
    - exploratory_predicate_order_symmetry
    - exploratory_optional_match_order_symmetry
    - exploratory_with_filter_shift_symmetry
    - exploratory_projection_reorder_symmetry
  max_variants_per_case: 4

coverage:
  enabled: true

feedback:
  enabled: false

oracle:
  enable_structural_diff: true
  enable_profile_metrics: true

clustering:
  enabled: true

reducer:
  enabled: selective
  strategy: validated
  reduce_graph: true
  preserve_metric_ratio: 1.5
  max_query_attempts: 32

execution:
  shards: 4
  cases_per_shard: 500
  per_query_timeout_seconds: 60
  per_case_timeout_seconds: 180
  resume: true
  write_every_n_cases: 25

artifacts:
  write_issue_drafts: false
