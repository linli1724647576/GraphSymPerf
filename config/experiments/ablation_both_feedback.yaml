experiment_id: ablation_both_feedback_2026_01
description: Both-family feedback-guided ablation.
seed: 20260522
output_root: runs/ablation_both_feedback_2026_01

systems:
  targets:
    - neo4j
    - memgraph
    - falkordb
    - agensgraph
    - arcadedb
    - apache_age

source:
  enabled:
    - gdsmith
    - ldbc_templates
  generator_target: neo4j
  base_run_config: config/graph_sym_perf.yaml
  gdsmith:
    max_seed_queries_per_shard: 2000
    num_queries: 2000
    num_tries: 1
  ldbc_templates:
    enabled: true
    max_seed_queries_per_shard: 200

transforms:
  enabled_families:
    - bool_redundancy
    - symmetry
  enabled_rules:
    - and_true_or
    - and_expr_or_true
    - or_false_and
    - or_expr_and_false
    - and_not_false_and
    - and_case_true
    - and_expr_null_partition
    - or_expr_null_contradiction
    - and_not_expr_null_contradiction
    - and_excluded_middle_or_null
    - or_guarded_contradiction
    - and_double_negated_true_or
    - or_duplicate_predicate
    - and_null_guarded_true
    - and_distributive_absorption
    - and_multi_layer_redundancy
    - arcade_and_true
    - arcade_or_false
    - arcade_and_not_false
    - arcade_and_true_or_false_expr
    - node_order_symmetry
    - edge_notation_symmetry
    - predicate_order_symmetry
    - pattern_order_symmetry
    - pattern_decomposition_symmetry
    - pattern_fusion_symmetry
    - path_endpoint_symmetry
    - label_order_symmetry
    - property_map_order_symmetry
    - alpha_renaming_symmetry
    - exploratory_pattern_order_symmetry
    - exploratory_predicate_order_symmetry
    - exploratory_optional_match_order_symmetry
    - exploratory_with_filter_shift_symmetry
    - exploratory_projection_reorder_symmetry
  max_variants_per_case: 4

coverage:
  enabled: true

feedback:
  enabled: true
  exploration_rate: 0.15
  min_rules_per_case: 1
  max_rules_per_case: 4

oracle:
  enable_structural_diff: true
  enable_profile_metrics: true

clustering:
  enabled: true

reducer:
  enabled: selective
  strategy: validated
  reduce_graph: true
  preserve_metric_ratio: 1.5
  max_query_attempts: 32

execution:
  shards: 4
  cases_per_shard: 500
  per_query_timeout_seconds: 60
  per_case_timeout_seconds: 180
  resume: true
  write_every_n_cases: 25

artifacts:
  write_issue_drafts: false
