experiment_id: ablation_bool_redundancy_2026_01
description: Transform-family ablation using only bool_redundancy rules.
seed: 20260522
output_root: runs/ablation_bool_redundancy_2026_01

systems:
  targets:
    - neo4j

source:
  kind: gdsmith
  base_run_config: config/graph_sym_perf.yaml
  max_cases: 8000
  gdsmith:
    num_queries: 8000

transforms:
  enabled_families:
    - bool_redundancy
  enabled_rules:
    - and_true_or
    - and_expr_or_true
    - or_false_and
    - or_expr_and_false
    - and_not_false_and
    - and_case_true
    - and_expr_null_partition
    - or_expr_null_contradiction
    - and_not_expr_null_contradiction
    - and_excluded_middle_or_null
    - or_guarded_contradiction
    - and_double_negated_true_or
    - arcade_and_true
    - arcade_or_false
    - arcade_and_not_false
    - arcade_and_true_or_false_expr
  max_variants_per_case: 4

coverage:
  enabled: true

feedback:
  enabled: true
  max_rules_per_case: 4

oracle:
  enable_structural_diff: true
  enable_profile_metrics: true

clustering:
  enabled: true

reducer:
  strategy: no_op

execution:
  shards: 8
  cases_per_shard: 1000
  per_query_timeout_seconds: 60
  per_case_timeout_seconds: 180
  resume: true
  write_every_n_cases: 25

artifacts:
  write_issue_drafts: true
