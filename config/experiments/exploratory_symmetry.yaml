experiment_id: exploratory_symmetry_2026_01
description: >
  Exploratory symmetry transforms (heuristic, dynamic-equivalence-gated).
  Measures how much additional coverage the exploratory rule space provides
  beyond the strict core.  Run separately from main_effectiveness
  (document/总体研究主线.md §4).
seed: 20260522
output_root: runs/exploratory_symmetry_2026_01

systems:
  targets:
    - neo4j
    - memgraph
    - falkordb
    - agensgraph
    - arcadedb
    - apache_age

source:
  enabled:
    - gdsmith
  generator_target: neo4j
  base_run_config: config/graph_sym_perf.yaml
  result_limit: 100
  gdsmith:
    max_seed_queries_per_shard: 2000
    num_queries: 2000
    num_tries: 1

transforms:
  enabled_families:
    - symmetry
  enabled_rules:
    - exploratory_pattern_order_symmetry
    - exploratory_predicate_order_symmetry
    - exploratory_optional_match_order_symmetry
    - exploratory_with_filter_shift_symmetry
    - exploratory_projection_reorder_symmetry
  gdsmith_safe_only: true
  max_variants_per_case: 3

coverage:
  enabled: true
  include_transformation_context: true
  write_per_case_evidence: true

feedback:
  enabled: false

oracle:
  enable_structural_diff: true
  enable_profile_metrics: true
  runtime_validation_policy: conservative

clustering:
  enabled: true
  write_signatures: true
  include_plan_only: true
  include_exploratory: true

reducer:
  enabled: selective
  strategy: validated
  reduce_graph: true
  preserve_metric_ratio: 1.5
  max_query_attempts: 32

execution:
  shards: 4
  workers_per_shard: 1
  cases_per_shard: 2000
  per_query_timeout_seconds: 60
  per_case_timeout_seconds: 180
