# GraphSymPerf real-database GDsmith symmetry mining configuration.

project:
  name: GraphSymPerf
  stage: v1

paths:
  artifact_dir: logs/{run_id}

systems:
  targets:
    - neo4j
    - memgraph
    - kuzu
  env:
    neo4j:
      required:
        - GRAPHSYMPERF_NEO4J_URI
        - GRAPHSYMPERF_NEO4J_USER
        - GRAPHSYMPERF_NEO4J_PASSWORD
      optional:
        database: GRAPHSYMPERF_NEO4J_DATABASE
    memgraph:
      required:
        - GRAPHSYMPERF_MEMGRAPH_HOST
        - GRAPHSYMPERF_MEMGRAPH_PORT
      optional:
        username: GRAPHSYMPERF_MEMGRAPH_USER
        password: GRAPHSYMPERF_MEMGRAPH_PASSWORD
    kuzu:
      required:
        - GRAPHSYMPERF_KUZU_DATABASE_PATH
      optional: {}
  settings:
    neo4j: {}
    memgraph: {}
    kuzu:
      require_dedicated_path: true

query_generation:
  source: gdsmith
  max_cases: 500
  result_limit: 100
  include_variable_length: true
  gdsmith:
    jar_env: GRAPHSYMPERF_GDSMITH_JAR
    algorithm: compared3
    num_tries: 1
    num_queries: 500
    random_seed: 20260522
    allow_destructive_env: GRAPHSYMPERF_GDSMITH_ALLOW_DESTRUCTIVE
    timeout_seconds: 180

equivalence:
  max_result_rows: 1000
  timeout_seconds: 30

oracle:
  enable_structural_diff: true
  enable_profile_metrics: true

coverage:
  enabled: true
  include_transformation_context: true
  write_per_case_evidence: true
  ratio_buckets:
    - 1.5
    - 2.0
    - 5.0
    - 10.0
    - 50.0
    - 100.0
    - 1000.0
  novelty_weights:
    structural: 0.5
    operator_delta: 1.0
    access_delta: 2.0
    predicate_delta: 2.0
    barrier_delta: 1.5
    cardinality_delta: 1.5
    work_delta: 2.0
    transformation_context: 0.2

feedback:
  enabled: false
  exploration_rate: 0.15
  seed: 20260522
  min_rules_per_case: 1
  max_rules_per_case: 4

clustering:
  enabled: true
  write_signatures: true
  representative_policy: support_then_ratio_then_size
  include_plan_only: true
  include_exploratory: false

transforms:
  enabled_rules:
    - node_order_symmetry
    - edge_notation_symmetry
    - predicate_order_symmetry
    - pattern_order_symmetry
    - path_endpoint_symmetry
    - label_order_symmetry
    - property_map_order_symmetry
    - alpha_renaming_symmetry
    - exploratory_pattern_order_symmetry
    - exploratory_predicate_order_symmetry
    - exploratory_optional_match_order_symmetry
  gdsmith_safe_only: true

confirmation:
  warmup: 1
  repeats: 5
  timeout_seconds: 30
  min_latency_ratio: 10.0
  min_latency_delta_ms: 50.0
  min_db_hits_ratio: 5.0
  min_rows_ratio: 5.0
