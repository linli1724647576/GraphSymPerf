# GraphSymPerf 500-query shard configuration with a longer GDsmith timeout.
#
# The default 500-case config uses a 180s GDsmith timeout, which is too tight
# for seeds that enter slow GDsmith generation phases. This config keeps the
# same mining budget and oracle thresholds, while allowing each shard to finish
# or produce a larger recoverable log.

project:
  name: GraphSymPerf
  stage: v1-500-longtimeout

paths:
  artifact_dir: logs/{run_id}

systems:
  targets:
    - neo4j
    - memgraph
    - falkordb
    - agensgraph
    - arcadedb
    - apache_age
    - ladybugdb
  env:
    neo4j:
      required:
        - GRAPHSYMPERF_NEO4J_URI
        - GRAPHSYMPERF_NEO4J_USER
        - GRAPHSYMPERF_NEO4J_PASSWORD
      optional:
        database: GRAPHSYMPERF_NEO4J_DATABASE
    memgraph:
      required:
        - GRAPHSYMPERF_MEMGRAPH_HOST
        - GRAPHSYMPERF_MEMGRAPH_PORT
      optional:
        username: GRAPHSYMPERF_MEMGRAPH_USER
        password: GRAPHSYMPERF_MEMGRAPH_PASSWORD
    falkordb:
      required:
        - GRAPHSYMPERF_FALKORDB_HOST
        - GRAPHSYMPERF_FALKORDB_PORT
        - GRAPHSYMPERF_FALKORDB_GRAPH
      optional:
        username: GRAPHSYMPERF_FALKORDB_USER
        password: GRAPHSYMPERF_FALKORDB_PASSWORD
    agensgraph:
      required:
        - GRAPHSYMPERF_AGENSGRAPH_URI
        - GRAPHSYMPERF_AGENSGRAPH_GRAPH
      optional:
        username: GRAPHSYMPERF_AGENSGRAPH_USER
        password: GRAPHSYMPERF_AGENSGRAPH_PASSWORD
        database: GRAPHSYMPERF_AGENSGRAPH_DATABASE
    arcadedb:
      required:
        - GRAPHSYMPERF_ARCADEDB_HTTP_URL
        - GRAPHSYMPERF_ARCADEDB_DATABASE
        - GRAPHSYMPERF_ARCADEDB_USER
        - GRAPHSYMPERF_ARCADEDB_PASSWORD
      optional:
        bolt_host: GRAPHSYMPERF_ARCADEDB_BOLT_HOST
        bolt_port: GRAPHSYMPERF_ARCADEDB_BOLT_PORT
    apache_age:
      required:
        - GRAPHSYMPERF_APACHE_AGE_URI
        - GRAPHSYMPERF_APACHE_AGE_GRAPH
      optional:
        username: GRAPHSYMPERF_APACHE_AGE_USER
        password: GRAPHSYMPERF_APACHE_AGE_PASSWORD
        database: GRAPHSYMPERF_APACHE_AGE_DATABASE
  settings:
    neo4j: {}
    memgraph: {}
    falkordb: {}
    agensgraph: {}
    arcadedb: {}
    apache_age: {}

query_generation:
  source: gdsmith
  max_cases: 500
  result_limit: 100
  include_variable_length: true
  gdsmith:
    jar_env: GRAPHSYMPERF_GDSMITH_JAR
    algorithm: compared3
    num_tries: 1
    num_queries: 500
    random_seed: 20260522
    allow_destructive_env: GRAPHSYMPERF_GDSMITH_ALLOW_DESTRUCTIVE
    timeout_seconds: 900

equivalence:
  max_result_rows: 1000
  timeout_seconds: 30

oracle:
  enable_structural_diff: true
  enable_profile_metrics: true

transforms:
  enabled_rules:
    - node_order_symmetry
    - edge_notation_symmetry
    - predicate_order_symmetry
    - pattern_order_symmetry
    - pattern_decomposition_symmetry
    - pattern_fusion_symmetry
    - path_endpoint_symmetry
    - label_order_symmetry
    - property_map_order_symmetry
    - alpha_renaming_symmetry
    - exploratory_pattern_order_symmetry
    - exploratory_predicate_order_symmetry
    - exploratory_optional_match_order_symmetry
    - exploratory_with_filter_shift_symmetry
    - exploratory_projection_reorder_symmetry
    - and_true_or
    - and_expr_or_true
    - or_false_and
    - or_expr_and_false
    - and_not_false_and
    - and_case_true
    - and_expr_null_partition
    - or_expr_null_contradiction
    - and_not_expr_null_contradiction
    - and_excluded_middle_or_null
    - or_guarded_contradiction
    - and_double_negated_true_or
    - or_duplicate_predicate
    - and_null_guarded_true
    - and_distributive_absorption
    - and_multi_layer_redundancy
    - arcade_and_true
    - arcade_or_false
    - arcade_and_not_false
    - arcade_and_true_or_false_expr
  gdsmith_safe_only: true

confirmation:
  warmup: 1
  repeats: 5
  timeout_seconds: 30
  min_latency_ratio: 10.0
  min_latency_delta_ms: 50.0
  min_db_hits_ratio: 5.0
  min_rows_ratio: 5.0
