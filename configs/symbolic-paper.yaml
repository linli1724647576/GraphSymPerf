# Public identifiers follow paper/vldb27-GraphSymPerf.pdf, Table 1.
pattern_catalog: paper-v1
patterns: [P1, P2, P3, P4, P5, P6, P7, P8, P9, P10, P11, P12, P13, S1, S2, S3, S4, S5, S6, S7, S8, S9, S10]
scales: [10, 100]
seeds: [0, 1, 2]
cases_per_pattern: 6
seconds_per_pattern: 120
schedule_seed: 0

database:
  dbms: neo4j
  language: cypher
  uri: bolt://127.0.0.1:7687
  user: neo4j
  password_env: GRAPHSYMPERF_NEO4J_PASSWORD
  database: neo4j
  dedicated: true
  allow_reset: true

generation:
  method: symbolic-v1
  log_files: []
  data_seed: 3
  complexity: 0
  state_variant: original
  composition:
    contexts: [count, with]
    threshold: 0
    # S6 uses row_limit=3 by default. Set it explicitly only in S6-only runs.

measurement:
  timeout_seconds: 30
  collect_plans: true

output: ../results/symbolic-paper
