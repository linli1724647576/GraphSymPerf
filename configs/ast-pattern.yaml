database:
  dbms: neo4j
  uri: bolt://127.0.0.1:7687
  user: neo4j
  password_env: GRAPHSYMPERF_NEO4J_PASSWORD
  database: neo4j
  dedicated: true
  allow_reset: false
generation:
  method: ast-pattern-v1
  data_seed: 0
  ast:
    max_attempts: 64
    require_target_entry: true
    grammar:
      match_shapes: [node, edge, chain, branch, converge, cycle, disconnected]
      match_features: [multi_label, relationship_alternatives, property_maps, named_relationship]
      row_operators: [query, union_all, conditional, limit]
      comparison_operators: ['=', '<>', '<', '<=', '>', '>=']
    ast_budget:
      clauses: 4
      nodes: 180
      expression_depth: 3
      subquery_depth: 3
      match_edges: 3
      projections: 2
      expression_arity: 3
      port_nodes: 128
    solver_budget:
      terminal_assignments: 32
      max_nodes: 200000
      max_edges: 1000000
patterns:
- P1
- P2
- P3
- P4
- P5
- P6
- P7
- P8
- P9
- P10
- P11
- P12
- P13
- S1
- S2
- S3
- S4
- S5
- S6
- S7
- S8
- S9
- S10
scales:
- 10
- 100
seeds:
- 0
- 3
cases_per_pattern: 4
seconds_per_pattern: 120
schedule_seed: 0
output: ../results/ast-pattern-v1
measurement:
  timeout_seconds: 30
  collect_plans: true
pattern_catalog: paper-v1
